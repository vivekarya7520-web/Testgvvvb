<!doctype html><meta charset="utf-8"><title>TS test</title>
<div id="ts"></div><pre id="o" style="white-space:pre-wrap"></pre>
<script>
const p = (s) => document.getElementById('o').textContent += s + '\n';
function ready() {
  turnstile.render('#ts', {
    sitekey: '0x4AAAAAADn09PiriH4xxgIz',
    'error-callback': (c) => p('ERROR: ' + c),
    callback: (t) => p('TOKEN OK (' + t.length + ' chars)')
  });
}
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=ready&render=explicit" async defer></script>
