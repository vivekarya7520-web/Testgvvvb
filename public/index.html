<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b4ea2">
<title>BEU Result — beuconnect</title>
<style>
  :root{--bg:#f5f6f9;--card:#fff;--tx:#14161a;--mut:#636b78;--br:#e2e5eb;--ac:#0b4ea2;--er:#c0392b;--ok:#18794e}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1014;--card:#161a20;--tx:#e9ebef;--mut:#98a0ad;--br:#242932;--ac:#3d82e8}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:24px 16px 56px}
  h1{font-size:22px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--mut);font-size:13px;margin:4px 0 22px}
  .card{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:18px}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);letter-spacing:.3px;text-transform:uppercase;margin:0 0 8px}
  select,input{width:100%;padding:14px 12px;font-size:16px;border:1px solid var(--br);border-radius:12px;background:var(--bg);color:var(--tx);appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:40px}
  input{letter-spacing:1.5px;font-variant-numeric:tabular-nums}
  input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
  .f{margin-bottom:18px}
  #ts{margin:16px 0 0;min-height:0}
  button{width:100%;padding:16px;font-size:16.5px;font-weight:700;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer;margin-top:18px}
  button:disabled{opacity:.45}
  .note{font-size:12.5px;color:var(--mut);margin:14px 0 0;line-height:1.5}
  .err{font-size:13px;color:var(--er);margin-top:12px;min-height:18px}
  .res dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
  .res dt{color:var(--mut);font-size:13px}
  .res dd{margin:0;font-weight:700}
  .badge{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--br);color:var(--mut);margin-bottom:12px}
  .spin{width:15px;height:15px;border:2px solid var(--br);border-top-color:var(--ac);border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:8px;animation:r .7s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  footer{color:var(--mut);font-size:11.5px;text-align:center;margin-top:26px;line-height:1.6}
  #out{margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>BEU Result</h1>
  <p class="sub">Bihar Engineering University, Patna</p>

  <div class="card">
    <div class="f">
      <label for="course">Course</label>
      <select id="course">
        <option>B.Tech</option>
        <option>M.Tech</option>
        <option>B.Arch</option>
        <option>MBA</option>
      </select>
    </div>
    <div class="f">
      <label for="exam">Exam</label>
      <select id="exam"></select>
    </div>
    <div class="f" style="margin-bottom:0">
      <label for="reg">Registration No.</label>
      <input id="reg" inputmode="numeric" autocomplete="off" placeholder="24101154020" maxlength="20">
    </div>
    <div id="ts"></div>
    <button id="go" disabled>Result dekho</button>
    <div class="err" id="msg"></div>
    <p class="note" id="note">Verification isi page pe hoti hai.</p>
  </div>

  <div id="out"></div>

  <footer>Unofficial portal · Data: beu-bih.ac.in<br>Result ke liye official site hi authority hai.</footer>
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script>
const SITEKEY = '0x4AAAAAADn09PiriH4xxgIz';
const API = 'https://beu-bih.ac.in/backend/v1/result/get-result';
const ROMAN = ['','I','II','III','IV','V','VI','VII','VIII'];
const FALLBACK = [
  ['B.Tech','B.Tech 8th Semester Supplementary Examination 2026',2026,8,'August/2026','2601098'],
  ['B.Tech','B.Tech 7th Semester Supplementary Examination 2026',2026,7,'August/2026','2601097'],
  ['B.Tech','B.Tech 6th Semester Supplementary Examination 2026',2026,6,'August/2026','2601096'],
  ['B.Tech','B.Tech 5th Semester Supplementary Examination 2026',2026,5,'August/2026','2601095'],
  ['B.Tech','B.Tech 4th Semester Supplementary Examination 2026',2026,4,'August/2026','2601094'],
  ['B.Tech','B.Tech 3rd Semester Supplementary Examination 2026',2026,3,'August/2026','2601093'],
  ['B.Tech','B.Tech 2nd Semester Supplementary Examination 2026',2026,2,'August/2026','2601092'],
  ['B.Tech','B.Tech 1st Semester Supplementary Examination 2026',2026,1,'August/2026','2601091'],
  ['B.Tech','B.Tech 8th Semester Examination 2026',2026,8,'May/2026','260108'],
  ['B.Tech','B.Tech 5th Semester Examination 2025',2025,5,'May/2026','250105'],
  ['B.Tech','B.Tech 3rd Semester Examination 2025',2025,3,'April/2026','250103'],
  ['B.Tech','B.Tech 4th Semester Examination 2025',2025,4,'December/2025','250104'],
  ['M.Tech','M.Tech 4th Semester Examination 2026',2025,4,'August/2026','260304'],
  ['M.Tech','M.Tech 3rd Semester Examination 2025',2025,3,'May/2026','250403'],
  ['M.Tech','M.Tech. 1st Semester Examination 2025',2025,1,'April/2026','250401'],
  ['B.Arch','B.Arch 3rd Semester Examination 2025',2025,3,'April/2026','250203'],
  ['B.Arch','B.Arch 5th Semester Examination 2025',2025,5,'May/2026','250205'],
  ['MBA','MBA 2nd Semester Examination 2026',2026,2,'August/2026','260402'],
  ['MBA','MBA 3rd Semester Examination 2025',2025,3,'August/2026','250403M']
];

const $ = (i) => document.getElementById(i);
const course = $('course'), sel = $('exam'), reg = $('reg'), btn = $('go'), msg = $('msg'), note = $('note'), out = $('out');
let all = [], wid = null, token = '', redirectOnly = false;

const examOf = () => all.find(e => String(e.examId) === sel.value);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

function b64(s) {
  const b = new TextEncoder().encode(s);
  let o = '';
  for (const x of b) o += String.fromCharCode(x);
  return btoa(o);
}

function urls(ex, r) {
  const d = b64(JSON.stringify({ semester: Number(ex.sem), session: String(ex.batch), exam_held: ex.held, exam_id: ex.examId }));
  return {
    page: 'https://beu-bih.ac.in/result-two/' + encodeURIComponent(ex.name) + '?d=' + d,
    api: API + '?' + new URLSearchParams({
      year: ex.batch, redg_no: r, semester: ROMAN[Number(ex.sem)] || String(ex.sem),
      exam_held: ex.held, exam_id: ex.examId, token: token
    })
  };
}

function renderList() {
  const c = course.value;
  const list = all.filter(e => e.course === c);
  sel.innerHTML = '';
  if (!list.length) { sel.innerHTML = '<option value="">Koi exam nahi</option>'; sync(); return; }
  for (const e of list) {
    const o = document.createElement('option');
    o.value = e.examId;
    o.textContent = e.name + ' — ' + e.held;
    sel.appendChild(o);
  }
  const saved = localStorage.getItem('beu.exam');
  if (saved && list.some(e => String(e.examId) === saved)) sel.value = saved;
  sync();
}

function sync() {
  btn.disabled = !(examOf() && /^\d{6,}$/.test(reg.value) && (redirectOnly || token));
}

function mountWidget() {
  if (redirectOnly || wid || !window.turnstile) return;
  try {
    wid = turnstile.render('#ts', {
      sitekey: SITEKEY,
      'refresh-expired': 'auto',
      callback: (t) => { token = t; msg.textContent = ''; sync(); },
      'expired-callback': () => { token = ''; sync(); },
      'error-callback': (code) => {
        token = ''; sync();
        const c = String(code);
        if (c === '110200' || c === '400020' || c === '400021' || c === '400070') {
          redirectOnly = true;
          try { turnstile.remove(wid); } catch {}
          wid = null;
          $('ts').innerHTML = '';
          note.textContent = 'Is domain pe verification nahi chalti — button dabane par BEU ke page pe khulega.';
          msg.textContent = '';
        } else {
          msg.textContent = 'Verification error ' + c + '. Reload karo.';
        }
        sync();
      }
    });
  } catch {}
}

async function load() {
  try {
    const r = await fetch('/api/exams');
    if (!r.ok) throw 0;
    const d = await r.json();
    const flat = [];
    for (const c of d) for (const e of (c.exams || [])) {
      flat.push({ course: c.courseName, name: e.examName, batch: e.batchYear, sem: e.semId, held: e.examHeld, examId: e.examId });
    }
    if (!flat.length) throw 0;
    all = flat;
  } catch {
    all = FALLBACK.map(f => ({ course: f[0], name: f[1], batch: f[2], sem: f[3], held: f[4], examId: f[5] }));
    msg.textContent = 'Live list load nahi hui — purani list dikha rahe hain.';
  }
  renderList();
}

async function go() {
  const ex = examOf(), r = reg.value.trim();
  if (!ex || !r) return;
  localStorage.setItem('beu.exam', sel.value);
  btn.disabled = true;
  out.innerHTML = '';
  msg.textContent = '';

  if (redirectOnly || !token) { window.location.href = urls(ex, r).page; return; }

  out.innerHTML = '<div class="card"><span class="spin"></span>Fetch ho raha hai…</div>';
  let res;
  try {
    res = await fetch(urls(ex, r).api, { headers: { Accept: 'application/json' } });
  } catch {
    out.innerHTML = '';
    msg.textContent = 'Direct call block — BEU pe le ja rahe hain…';
    window.location.href = urls(ex, r).page;
    return;
  }

  let body = null;
  try { body = await res.json(); } catch {}

  if (!body || body.message === 'Access denied.') {
    out.innerHTML = '';
    msg.textContent = 'Token reject hua. Naya token aane do, phir dobara dabao.';
    try { turnstile.reset(wid); } catch {}
    token = '';
    sync();
    return;
  }

  const f = { name: '', sgpa: '', cgpa: '' };
  const walk = (o) => {
    if (!o || typeof o !== 'object') return;
    for (const [k, v] of Object.entries(o)) {
      const kk = k.toLowerCase();
      if (v && typeof v === 'object') { walk(v); continue; }
      if (typeof v !== 'string' && typeof v !== 'number') continue;
      if (!f.sgpa && /sgpa/.test(kk)) f.sgpa = String(v);
      if (!f.cgpa && /cgpa/.test(kk)) f.cgpa = String(v);
      if (!f.name && /^(name|studentname|student_name|stuname)$/.test(kk)) f.name = String(v);
    }
  };
  walk(body);

  if (!f.name && !f.sgpa && !f.cgpa) {
    out.innerHTML = '<div class="card"><span class="badge">No record</span><p style="margin:0">Is reg no. ka result nahi mila.</p></div>';
  } else {
    out.innerHTML = '<div class="card res"><span class="badge">Result</span><dl>' +
      (f.name ? '<dt>Name</dt><dd>' + esc(f.name) + '</dd>' : '') +
      '<dt>Reg No.</dt><dd>' + esc(r) + '</dd>' +
      (f.sgpa ? '<dt>SGPA</dt><dd>' + esc(f.sgpa) + '</dd>' : '') +
      (f.cgpa ? '<dt>CGPA</dt><dd>' + esc(f.cgpa) + '</dd>' : '') +
      '</dl></div>';
  }
  try { turnstile.reset(wid); } catch {}
  token = '';
  sync();
}

course.addEventListener('change', () => { localStorage.setItem('beu.course', course.value); renderList(); });
sel.addEventListener('change', () => { localStorage.setItem('beu.exam', sel.value); sync(); });
reg.addEventListener('input', () => { reg.value = reg.value.replace(/\D/g, ''); sync(); });
reg.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !btn.disabled) go(); });
btn.addEventListener('click', go);

course.value = localStorage.getItem('beu.course') || 'B.Tech';
if (![...course.options].some(o => o.value === course.value)) course.value = 'B.Tech';

const t = setInterval(() => {
  if (window.turnstile && turnstile.render) { clearInterval(t); mountWidget(); }
}, 300);

load();
</script>
</body>
</html>
