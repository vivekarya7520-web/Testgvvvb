<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEU Result</title>
<style>
  :root{--bg:#f6f7fb;--card:#fff;--tx:#16181d;--mut:#5d6470;--br:#e3e6ec;--ac:#0b4ea2;--ac2:#083a7a;--er:#c0392b;--ok:#18794e}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--tx:#e8eaee;--mut:#9aa2af;--br:#252a33;--ac:#2f6fd0;--ac2:#3d82e8}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 0 6px}
  select,input{width:100%;padding:12px;font-size:16px;border:1px solid var(--br);border-radius:10px;background:var(--bg);color:var(--tx)}
  input{letter-spacing:1px}
  .mt{margin-top:14px}
  button{width:100%;padding:14px;font-size:16px;font-weight:600;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
  button:disabled{opacity:.55}
  button.sec{background:transparent;color:var(--ac);border:1px solid var(--br)}
  #ts{margin:14px 0 0;min-height:66px}
  .note{font-size:12.5px;color:var(--mut);margin-top:10px}
  .err{color:var(--er);font-size:13.5px;margin-top:10px}
  .res dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
  .res dt{color:var(--mut);font-size:13px}
  .res dd{margin:0;font-weight:600}
  .badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--br);color:var(--mut);margin-bottom:10px}
  .spin{width:16px;height:16px;border:2px solid var(--br);border-top-color:var(--ac);border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:8px;animation:r .7s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  footer{color:var(--mut);font-size:12px;text-align:center;margin-top:22px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>BEU Result</h1>
  <p class="sub">Bihar Engineering University, Patna</p>

  <div class="card">
    <label for="exam">Exam chuno</label>
    <select id="exam"><option value="">Load ho raha hai...</option></select>
    <div class="mt">
      <label for="reg">Registration No.</label>
      <input id="reg" inputmode="numeric" autocomplete="off" placeholder="24101154020" maxlength="20">
    </div>
    <div id="ts"></div>
    <div class="mt"><button id="go" disabled>Result dekho</button></div>
    <div id="msg" class="err"></div>
    <p class="note" id="note"></p>
  </div>

  <div id="out"></div>

  <footer>An unofficial portal. Data source: beu-bih.ac.in</footer>
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script>
const SITEKEY = '0x4AAAAAADn09PiriH4xxgIz';
const API = 'https://beu-bih.ac.in/backend/v1/result/get-result';
const SEMGET = 'https://beu-bih.ac.in/backend/v1/result/sem-get';
const ROMAN = ['','I','II','III','IV','V','VI','VII','VIII'];

const FALLBACK = [
  ['B.Tech','B.Tech 8th Semester Supplementary Examination 2026',2026,8,'August/2026','2601098'],
  ['B.Tech','B.Tech 7th Semester Supplementary Examination 2026',2026,7,'August/2026','2601097'],
  ['B.Tech','B.Tech 6th Semester Supplementary Examination 2026',2026,6,'August/2026','2601096'],
  ['B.Tech','B.Tech 5th Semester Supplementary Examination 2026',2026,5,'August/2026','2601095'],
  ['B.Tech','B.Tech 4th Semester Supplementary Examination 2026',2026,4,'August/2026','2601094'],
  ['B.Tech','B.Tech 3rd Semester Supplementary Examination 2026',2026,3,'August/2026','2601093'],
  ['B.Tech','B.Tech 2nd Semester Supplementary Examination 2026',2026,2,'August/2026','2601092'],
  ['B.Tech','B.Tech 1st Semester Supplementary Examination 2026',2026,1,'August/2026','2601091'],
  ['B.Tech','B.Tech 8th Semester Examination 2026',2026,8,'May/2026','260108'],
  ['B.Tech','B.Tech 5th Semester Examination 2025',2025,5,'May/2026','250105'],
  ['B.Tech','B.Tech 3rd Semester Examination 2025',2025,3,'April/2026','250103'],
  ['B.Tech','B.Tech 4th Semester Examination 2025',2025,4,'December/2025','250104'],
  ['B.Arch','B.Arch 3rd Semester Examination 2025',2025,3,'April/2026','250203'],
  ['MBA','MBA 2nd Semester Examination 2026',2026,2,'August/2026','260402']
];

const $ = (id) => document.getElementById(id);
const examSel = $('exam'), regIn = $('reg'), goBtn = $('go'), msgEl = $('msg'), noteEl = $('note'), outEl = $('out');

let wid = null, token = '', exams = [], redirectOnly = false;

function setMsg(t, cls) { msgEl.textContent = t || ''; msgEl.className = cls || 'err'; }
function examOf() { return exams.find(e => String(e.examId) === examSel.value); }

function b64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

function pageUrl(ex) {
  const d = b64(JSON.stringify({ semester: Number(ex.sem), session: String(ex.batch), exam_held: ex.held, exam_id: ex.examId }));
  return 'https://beu-bih.ac.in/result-two/' + encodeURIComponent(ex.name) + '?d=' + d;
}

function fillExams(list) {
  exams = list;
  examSel.innerHTML = '';
  if (!list.length) { examSel.innerHTML = '<option value="">Koi exam nahi mila</option>'; return; }
  const groups = {};
  for (const e of list) (groups[e.course] = groups[e.course] || []).push(e);
  for (const c of Object.keys(groups)) {
    const og = document.createElement('optgroup');
    og.label = c;
    for (const e of groups[c]) {
      const o = document.createElement('option');
      o.value = e.examId;
      o.textContent = e.name.replace(/^[^ ]+ /, '') + ' — ' + e.held;
      og.appendChild(o);
    }
    examSel.appendChild(og);
  }
  check();
}

function loadFallback() {
  fillExams(FALLBACK.map(f => ({ course: f[0], name: f[1], batch: f[2], sem: f[3], held: f[4], examId: f[5] })));
  noteEl.textContent = 'Live exam list load nahi hui, list purani hai.';
}

async function loadExams() {
  try {
    const r = await fetch(SEMGET);
    if (!r.ok) throw 0;
    const data = await r.json();
    const flat = [];
    for (const c of data) for (const e of (c.exams || [])) {
      flat.push({ course: c.courseName, name: e.examName, batch: e.batchYear, sem: e.semId, held: e.examHeld, examId: e.examId });
    }
    if (!flat.length) throw 0;
    fillExams(flat);
  } catch { loadFallback(); }
}

function mountWidget() {
  if (redirectOnly || wid || !window.turnstile) return;
  try {
    wid = turnstile.render('#ts', {
      sitekey: SITEKEY,
      'refresh-expired': 'auto',
      callback: (t) => { token = t; setMsg(''); check(); },
      'expired-callback': () => { token = ''; check(); },
      'error-callback': (c) => {
        token = ''; check();
        if (['110200', '400020', '400021', '400070'].includes(String(c))) {
          redirectOnly = true;
          try { turnstile.remove(wid); } catch {}
          wid = null; $('ts').innerHTML = '';
          noteEl.textContent = 'Yahan verification nahi chalti — button dabane par BEU ke page pe le jayenge.';
          check();
        } else {
          setMsg('Verification error ' + c + '. Page reload karo.');
        }
      }
    });
  } catch {}
}

function check() {
  const ok = examSel.value && /^\d{6,}$/.test(regIn.value.trim()) && (redirectOnly || token);
  goBtn.disabled = !ok;
}

async function search() {
  const ex = examOf();
  const reg = regIn.value.trim();
  if (!ex || !reg) return;
  goBtn.disabled = true;
  outEl.innerHTML = '';
  setMsg('');

  const url = API + '?' + new URLSearchParams({
    year: ex.batch, redg_no: reg, semester: ROMAN[Number(ex.sem)] || String(ex.sem),
    exam_held: ex.held, exam_id: ex.examId, token: token
  });

  let res;
  try {
    res = await fetch(url, { headers: { Accept: 'application/json' } });
  } catch {
    setMsg('Direct call block hai — BEU ke page pe le ja rahe hain...');
    window.location.href = pageUrl(ex);
    return;
  }

  let body = null;
  try { body = await res.json(); } catch {}

  if (!body || body.message === 'Access denied.') {
    setMsg('Token reject hua. Naya token aane do, phir dobara dabao.');
    try { turnstile.reset(wid); } catch {}
    token = '';
    check();
    return;
  }

  const f = { name: '', sgpa: '', cgpa: '' };
  const walk = (o) => {
    if (!o || typeof o !== 'object') return;
    for (const [k, v] of Object.entries(o)) {
      const kk = k.toLowerCase();
      if (v && typeof v === 'object') { walk(v); continue; }
      if (typeof v !== 'string' && typeof v !== 'number') continue;
      if (!f.sgpa && /sgpa/.test(kk)) f.sgpa = String(v);
      if (!f.cgpa && /cgpa/.test(kk)) f.cgpa = String(v);
      if (!f.name && /^(name|studentname|student_name|stuname)$/.test(kk)) f.name = String(v);
    }
  };
  walk(body);

  if (!f.name && !f.sgpa && !f.cgpa) {
    outEl.innerHTML = '<div class="card"><span class="badge">No record</span><p style="margin:0">Is reg no. ka result nahi mila.</p></div>';
  } else {
    outEl.innerHTML = '<div class="card res"><span class="badge">Result</span><dl>' +
      (f.name ? '<dt>Name</dt><dd>' + esc(f.name) + '</dd>' : '') +
      '<dt>Reg No.</dt><dd>' + esc(reg) + '</dd>' +
      (f.sgpa ? '<dt>SGPA</dt><dd>' + esc(f.sgpa) + '</dd>' : '') +
      (f.cgpa ? '<dt>CGPA</dt><dd>' + esc(f.cgpa) + '</dd>' : '') +
      '</dl></div>';
  }

  try { turnstile.reset(wid); } catch {}
  token = '';
  check();
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

regIn.addEventListener('input', () => { regIn.value = regIn.value.replace(/\D/g, ''); check(); });
examSel.addEventListener('change', check);
goBtn.addEventListener('click', search);
regIn.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !goBtn.disabled) search(); });

const boot = setInterval(() => {
  if (window.turnstile && turnstile.render) { clearInterval(boot); mountWidget(); }
}, 300);

loadExams();
</script>
</html>
